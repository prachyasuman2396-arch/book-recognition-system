version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: book-recognition-system:latest
    container_name: book-recognition-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      GRAPH_CHECKPOINT_BACKEND: sqlite
      GRAPH_CHECKPOINT_DB_PATH: /app/data/checkpoints/graph_state.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: book-recognition-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: book-recognition-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

volumes:
  redis-data:
