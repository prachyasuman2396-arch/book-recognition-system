apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-recognition-api
  labels:
    app: book-recognition-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: book-recognition-api
  template:
    metadata:
      labels:
        app: book-recognition-api
    spec:
      containers:
        - name: api
          image: book-recognition-system:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: book-recognition-secrets
            - configMapRef:
                name: book-recognition-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: book-recognition-api
spec:
  selector:
    app: book-recognition-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: book-recognition-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: book-recognition-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
